name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you saw. A minimal code sample helps most.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.2.0
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 140 on Windows 11
